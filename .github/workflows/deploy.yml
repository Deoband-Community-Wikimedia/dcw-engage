name: Deploy to DCW Production

on:
  push:
    branches:
      - main # This will trigger the deployment every time you merge code into the main branch
  workflow_dispatch: # Allows you to manually trigger the deployment from the GitHub Actions tab

# One deploy at a time: a merge made while another deploy is still uploading
# waits for it, instead of both uploading to the server at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: gd, mbstring   # mpdf/mpdf (member card and receipt PDFs) needs both

    # A merge that doesn't even parse must never reach the server. The PR check (verify.yml) normally catches
    # this first, but a direct push to main or a manual run skips it, so check again right before uploading.
    - name: PHP syntax check (lint)
      run: |
        status=0
        while IFS= read -r file; do
          if ! out=$(php -l "$file" 2>&1); then
            echo "$out"
            status=1
          fi
        done < <(find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./.git/*")
        if [ "$status" -ne 0 ]; then
          echo "Syntax errors found. Deployment stopped before anything was uploaded."
        fi
        exit $status

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
          
    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress
    
    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps       # Enforce secure TLS encryption
        security: loose      # Prevents FTPS handshake timeouts on Hostinger shared hosting
        timeout: 300000      # Increased to 5 minutes to prevent Hostinger timeout errors
        local-dir: ./
        server-dir: ./ # <-- Crucial! Tells it to land in your /engage folder
        
        # Protect production files from being overwritten or deleted!
        exclude: |
          **/.git*
          **/.git*/**
          .github/**
          config.php
          uploads/**
          README.md
